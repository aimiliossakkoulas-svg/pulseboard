<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="CompanyBoard brand image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b17"/>
      <stop offset="45%" stop-color="#0b1a33"/>
      <stop offset="100%" stop-color="#071126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19d3ff"/>
      <stop offset="100%" stop-color="#35f4b5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <circle cx="1340" cy="140" r="220" fill="#1ad7ff" opacity="0.17" filter="url(#softBlur)"/>
  <circle cx="210" cy="760" r="280" fill="#2df1be" opacity="0.1" filter="url(#softBlur)"/>

  <g transform="translate(140 150)">
    <rect x="0" y="0" width="78" height="78" rx="20" fill="#071a33" stroke="#21d8ff" stroke-opacity="0.75"/>
    <path d="M20 51V27h16c14 0 22 8 22 20s-8 20-22 20H20zm12-10h4c7 0 11-5 11-14s-4-13-11-13h-4v27z" fill="url(#accent)"/>
    <circle cx="58" cy="23" r="6" fill="#19d3ff" opacity="0.9"/>
  </g>

  <g transform="translate(250 154)">
    <text x="0" y="56" fill="#e9f0fb" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="0.5">CompanyBoard</text>
    <text x="4" y="94" fill="#8ba1bb" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" letter-spacing="2.2">TRUSTED OPERATING NETWORK</text>
  </g>

  <g transform="translate(140 300)">
    <text x="0" y="84" fill="#f5f9ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="86" font-weight="700">Turn Verified Signal</text>
    <text x="0" y="178" fill="#f5f9ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="86" font-weight="700">Into Partnership Momentum</text>
    <text x="0" y="246" fill="#9cb1c9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34">Private company reputation, selective visibility, and high-fit partner discovery.</text>
  </g>

  <g transform="translate(140 620)">
    <rect x="0" y="0" width="1260" height="170" rx="28" fill="url(#glass)" stroke="#2b3f5e"/>

    <g transform="translate(42 44)">
      <text x="0" y="0" fill="#7fead1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" letter-spacing="1.8">REPUTATION LAYER</text>
      <text x="0" y="48" fill="#e7eef8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700">92</text>
      <text x="0" y="78" fill="#8fa5bf" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">Trust Index</text>
    </g>

    <g transform="translate(370 44)">
      <text x="0" y="0" fill="#7fd7ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" letter-spacing="1.8">PARTNER MATCHING</text>
      <text x="0" y="48" fill="#e7eef8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700">4 Active</text>
      <text x="0" y="78" fill="#8fa5bf" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">Qualified Introductions</text>
    </g>

    <g transform="translate(760 44)">
      <text x="0" y="0" fill="#7fd7ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" letter-spacing="1.8">SELECTIVE SHARING</text>
      <text x="0" y="48" fill="#e7eef8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="700">Permissioned</text>
      <text x="0" y="78" fill="#8fa5bf" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">Metrics Visibility</text>
    </g>
  </g>

  <g stroke="url(#accent)" stroke-opacity="0.7" fill="none">
    <path d="M1300 705c50-20 85-58 106-102"/>
    <path d="M1265 760c66-15 111-55 140-112"/>
  </g>
